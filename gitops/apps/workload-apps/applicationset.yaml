# Namespace-only ApplicationSet — keeps env namespaces defined in Git
# Service Helm apps: boutique-applicationset.yaml (Topic 09)
# Topic 17: project boutique-workloads — sync AppProjects first on rebuild (Topic 06.5 / 17.3).
# CRITICAL: prod namespace app must NOT enable automated sync (same as workloads).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: boutique-dev-ns
            path: gitops/envs/dev
            namespace: dev
            autoSync: true
          - name: boutique-stage-ns
            path: gitops/envs/stage
            namespace: stage
            autoSync: true
          - name: boutique-prod-ns
            path: gitops/envs/prod
            namespace: prod
            autoSync: false
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "35"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: boutique-workloads
      source:
        repoURL: https://gitlab.com/btilki/boutique-eks-gitops.git
        targetRevision: main
        path: "{{.path}}"
        directory:
          include: "namespace.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}
