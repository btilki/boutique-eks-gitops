# external-dns — GitOps values
# Setup Topic 05 · pin target 0.15.x (docs/versions.md)
#
# REPLACE before install:
#   arn:aws:iam::868480224481:role/boutique-eks-gitops-external-dns <- terraform output -raw irsa_external_dns_role_arn
#   Z0450359HEFSZWRHZ73V       <- terraform output -raw route53_zone_id
#   biroltilki.art <- biroltilki.art

provider: aws
policy: sync
registry: txt
txtOwnerId: boutique-eks-gitops

domainFilters:
  - "biroltilki.art"

# Restrict to our hosted zone (recommended)
zoneIdFilters:
  - "Z0450359HEFSZWRHZ73V"

sources:
  - ingress
  - service

aws:
  region: eu-central-1
  zoneType: public

serviceAccount:
  create: true
  name: external-dns
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::868480224481:role/boutique-eks-gitops-external-dns"

# Pin image to 0.15.x line
image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.15.1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
