# ClusterSecretStore — AWS Secrets Manager + SSM via IRSA
# Setup Topic 07 Step 7.4
# ServiceAccount must match IRSA trust: external-secrets/external-secrets
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-cluster-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Optional SSM Parameter Store store (same IRSA)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm-parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
