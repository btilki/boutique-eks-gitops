# Grafana Loki — Topic 08
# Pin: Helm chart grafana/loki 6.24.0 (Loki 3.x) — verify with helm show chart
# SingleBinary mode for pilot cost/simplicity on 3× m6i.large

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h # 7 days
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_query_series: 5000

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    # Chart 6.24 needs a writable /var/loki (RO root FS otherwise → CrashLoop)
    enabled: true
    size: 10Gi

gateway:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

# Memcached caches default on — too heavy for 3× m6i.large with kube-prometheus
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

monitoring:
  selfMonitoring:
    enabled: false

test:
  enabled: false
