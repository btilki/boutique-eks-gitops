# SMTP password for Alertmanager — synced by ESO (Topic 08 Step 8.4)
# NEVER commit the password. Create AWS secret first:
#   aws secretsmanager create-secret --name boutique-eks-gitops/alertmanager-smtp \
#     --secret-string '{"password":"<SMTP_PASSWORD>"}' --region eu-central-1
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: boutique-eks-gitops/alertmanager-smtp
        property: password
