# Critical + email path test rules — Topic 08
# AlertmanagerEmailTest: always-firing test for Step 8.5; disable after inbox confirmed.
# BoutiqueIngressDown: activates once Boutique/smoke Ingress metrics exist (Topic 09+).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: boutique-alerting
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  groups:
    - name: boutique.email-test
      rules:
        - alert: AlertmanagerEmailTest
          expr: vector(0)
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager email path test (Topic 08)"
            description: "Always-firing test alert. Delete/disable this rule after email is confirmed."
    - name: boutique.critical
      rules:
        - alert: BoutiqueIngressDown
          # Probe via kube-prometheus blackbox optional later; placeholder uses absent ingress metrics
          expr: |
            absent(kube_ingress_info{namespace="prod",ingress=~".*boutique.*"})
              and on() (vector(1) == 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Boutique ingress missing/down (prod)"
            description: "Replace expression with blackbox/ALB probe when storefront is live (Topic 09+)."
