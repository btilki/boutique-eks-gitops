# Require image references by digest (@sha256:...) for app namespaces
# Setup Topic 07
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require image digest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    argocd.argoproj.io/sync-wave: "21"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - dev
                - stage
                - prod
      validate:
        message: "Images must be pinned by digest (@sha256:...). Tags alone are not allowed."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "*@sha256:*"
          - list: "request.object.spec.initContainers"
            pattern:
              image: "*@sha256:*"
