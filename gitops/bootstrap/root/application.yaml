# Root app-of-apps — boutique-eks-gitops
# Setup Topic 06 Step 6.4
#
# REPLACE:
#   <GITLAB_REPO_URL> <- HTTPS clone URL of this repository (e.g. https://gitlab.com/group/boutique-eks-gitops.git)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: root
spec:
  project: default
  source:
    repoURL: <GITLAB_REPO_URL>
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
