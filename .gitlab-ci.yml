# boutique-eks-gitops — GitLab CI
# Setup Topic 10 · Contract: docs/ci.md · Pins: docs/versions.md
#
# Stages: test → build → scan → sign → gitops (digest MR to envs/dev only)
# HARD RULES: no kubectl / no argocd CLI / no static AWS keys / no prod path writes
#
# Post-teardown (M4): pipelines are DORMANT by default. AWS/ECR/OIDC are gone;
# auto-runs on main would fail and look like a broken project. Re-enable only
# when rebuilding: set CI/CD variable ENABLE_PILOT_CI=true (and restore AWS).

workflow:
  rules:
    - if: $ENABLE_PILOT_CI == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_PILOT_CI == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ENABLE_PILOT_CI == "true" && $CI_COMMIT_BRANCH =~ /^ci\/.*/
    - when: never

variables:
  AWS_DEFAULT_REGION: "eu-central-1"
  TRIVY_VERSION: "0.71.0"
  COSIGN_VERSION: "2.4.3"
  # v0.10.6 lives in ECR from Topic 09 bootstrap (Artifact Registry is not publicly pullable).
  # Default: retag ECR :bootstrap. Set BOUTIQUE_BUILD_MODE=git to rebuild from GitHub.
  BOUTIQUE_BUILD_MODE: "ecr-bootstrap"
  BOUTIQUE_SOURCE_TAG: "bootstrap"
  BOUTIQUE_GIT_URL: "https://github.com/GoogleCloudPlatform/microservices-demo.git"
  BOUTIQUE_GIT_REF: "v0.10.6"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

default:
  image: docker:27.1.1
  services:
    - name: docker:27.1.1-dind
      alias: docker
      command: ["--tls=false"]

stages:
  - test
  - build
  - scan
  - sign
  - gitops

helm_lint:
  stage: test
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  services: []
  script:
    - helm version
    - helm lint charts/frontend charts/cartservice charts/redis charts/checkoutservice
    - helm lint charts/productcatalogservice charts/currencyservice charts/paymentservice charts/shippingservice
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.service_matrix:
  parallel:
    matrix:
      - SERVICE: [frontend, productcatalogservice, cartservice, checkoutservice, currencyservice, paymentservice, shippingservice]

.aws_ecr:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache bash curl jq git
    - |
      set -euo pipefail
      echo "${GITLAB_OIDC_TOKEN}" > /tmp/web-identity-token
      # Alpine job image cannot run glibc AWS CLI. Use amazon/aws-cli via DinD.
      # Do NOT bind-mount the token file: with DOCKER_HOST=tcp://docker:2375 the
      # daemon cannot see the job container FS (mount becomes a directory).
      cat > /usr/local/bin/aws <<'AWSEOF'
      #!/bin/sh
      TOKEN="$(cat /tmp/web-identity-token)"
      exec docker run --rm \
        -e AWS_DEFAULT_REGION \
        -e AWS_ROLE_ARN \
        -e AWS_ROLE_SESSION_NAME=gitlab-ci \
        -e AWS_WEB_IDENTITY_TOKEN="${TOKEN}" \
        --entrypoint /bin/bash \
        amazon/aws-cli:2.15.57 \
        -lc 'echo "$AWS_WEB_IDENTITY_TOKEN" > /tmp/oidc; export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc; unset AWS_WEB_IDENTITY_TOKEN; exec aws "$@"' -- "$@"
      AWSEOF
      sed -i 's/^[[:space:]]*//' /usr/local/bin/aws
      chmod +x /usr/local/bin/aws
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info >/dev/null
      test -n "${AWS_ROLE_ARN}"
      export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION}"
      aws --version
      aws sts get-caller-identity
      ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
      export REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
        | docker login --username AWS --password-stdin "${REGISTRY}"

build:
  stage: build
  extends:
    - .service_matrix
    - .aws_ecr
  script:
    - |
      set -euo pipefail
      DST="${REGISTRY}/boutique-eks-gitops/${SERVICE}"
      TAG="ci-${CI_COMMIT_SHORT_SHA}"
      MODE="${BOUTIQUE_BUILD_MODE:-ecr-bootstrap}"
      if [ "${MODE}" = "git" ]; then
        WORKDIR="$(pwd)/.boutique-src"
        rm -rf "${WORKDIR}"
        git clone --depth 1 --branch "${BOUTIQUE_GIT_REF}" "${BOUTIQUE_GIT_URL}" "${WORKDIR}"
        case "${SERVICE}" in
          cartservice) CTX="src/cartservice/src" ;;
          *) CTX="src/${SERVICE}" ;;
        esac
        docker build --platform linux/amd64 -t "${DST}:${TAG}" "${WORKDIR}/${CTX}"
        SOURCE="${BOUTIQUE_GIT_URL}@${BOUTIQUE_GIT_REF}"
      else
        SRC="${DST}:${BOUTIQUE_SOURCE_TAG}"
        docker pull "${SRC}"
        docker tag "${SRC}" "${DST}:${TAG}"
        SOURCE="ecr:${BOUTIQUE_SOURCE_TAG}"
      fi
      # CRITICAL: protobufjs CVE-2026-41242 in Boutique Node services
      if [ "${SERVICE}" = "currencyservice" ] || [ "${SERVICE}" = "paymentservice" ]; then
        docker build --platform linux/amd64 \
          --build-arg "BASE_IMAGE=${DST}:${TAG}" \
          -f ci/docker/patch-protobufjs.Dockerfile \
          -t "${DST}:${TAG}" \
          ci/docker
        SOURCE="${SOURCE}+protobufjs-7.5.5"
      fi
      PUSH_LOG="$(docker push "${DST}:${TAG}" 2>&1 | tee /dev/stderr)"
      # Prefer digest from push output (RepoDigests can still point at the pre-patch image).
      DIGEST="$(printf '%s\n' "${PUSH_LOG}" | awk '/digest:/{print $NF; exit}')"
      if [ -z "${DIGEST}" ] || [[ "${DIGEST}" != sha256:* ]]; then
        DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${DST}:${TAG}" | awk -F@ '{print $2}')"
      fi
      if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "<no value>" ] || [[ "${DIGEST}" != sha256:* ]]; then
        DIGEST="$(aws ecr describe-images --repository-name "boutique-eks-gitops/${SERVICE}" \
          --image-ids imageTag="${TAG}" --region "${AWS_DEFAULT_REGION}" \
          --query 'imageDetails[0].imageDigest' --output text)"
      fi
      test -n "${DIGEST}" && [[ "${DIGEST}" == sha256:* ]]
      {
        echo "SERVICE=${SERVICE}"
        echo "DIGEST=${DIGEST}"
        echo "IMAGE=${DST}@${DIGEST}"
        echo "TAG=${TAG}"
        echo "SOURCE=${SOURCE}"
      } | tee "digest-${SERVICE}.env"
  artifacts:
    paths:
      - "digest-${SERVICE}.env"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

scan:
  stage: scan
  extends:
    - .service_matrix
    - .aws_ecr
  needs:
    - job: build
  script:
    - |
      set -euo pipefail
      # shellcheck disable=SC1090
      source "digest-${SERVICE}.env"
      curl -fsSL -o /tmp/trivy.tgz \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      tar -xzf /tmp/trivy.tgz -C /tmp trivy
      /tmp/trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed "${IMAGE}"
  artifacts:
    paths:
      - "digest-${SERVICE}.env"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sign:
  stage: sign
  extends:
    - .service_matrix
    - .aws_ecr
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - job: build
    - job: scan
  script:
    - |
      set -euo pipefail
      # shellcheck disable=SC1090
      source "digest-${SERVICE}.env"
      test -n "${SIGSTORE_ID_TOKEN:-}"
      test -n "${IMAGE:-}"
      apk add --no-cache ca-certificates
      curl -fsSL -o /tmp/cosign \
        "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
      chmod +x /tmp/cosign
      export COSIGN_YES=true
      docker pull "${IMAGE}"
      # ECR repos are IMMUTABLE: re-signing the same digest cannot overwrite *.sig tags.
      # Use OCI 1.1 referrers when possible; if a prior signature exists, treat as success.
      set +e
      SIGN_OUT="$(/tmp/cosign sign --yes --identity-token="${SIGSTORE_ID_TOKEN}" \
        --registry-referrers-mode=oci-1-1 \
        "${IMAGE}" 2>&1)"
      SIGN_RC=$?
      set -e
      printf '%s\n' "${SIGN_OUT}"
      if [ "${SIGN_RC}" -eq 0 ]; then
        exit 0
      fi
      if printf '%s\n' "${SIGN_OUT}" | grep -qiE 'already exists|TagAlreadyExists|IMAGE_TAG_ALREADY_EXISTS|entity already exists'; then
        echo "cosign: signature already present for ${IMAGE} — OK"
        exit 0
      fi
      # Fallback without referrers (first-time tag-based), still tolerate immutable collision
      set +e
      SIGN_OUT="$(/tmp/cosign sign --yes --identity-token="${SIGSTORE_ID_TOKEN}" "${IMAGE}" 2>&1)"
      SIGN_RC=$?
      set -e
      printf '%s\n' "${SIGN_OUT}"
      if [ "${SIGN_RC}" -eq 0 ]; then
        exit 0
      fi
      if printf '%s\n' "${SIGN_OUT}" | grep -qiE 'already exists|TagAlreadyExists|IMAGE_TAG_ALREADY_EXISTS|entity already exists'; then
        echo "cosign: signature already present for ${IMAGE} — OK"
        exit 0
      fi
      exit "${SIGN_RC}"
  artifacts:
    paths:
      - "digest-${SERVICE}.env"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitops_digest_mr:
  stage: gitops
  image: alpine:3.20
  services: []
  # Explicit matrix needs so all digest-*.env artifacts are downloaded.
  needs:
    - job: sign
      parallel:
        matrix:
          - SERVICE:
              [
                frontend,
                productcatalogservice,
                cartservice,
                checkoutservice,
                currencyservice,
                paymentservice,
                shippingservice,
              ]
  before_script:
    - apk add --no-cache git curl bash yq
  script:
    - |
      bash <<'EOS'
      set -euo pipefail
      command -v kubectl >/dev/null 2>&1 && { echo "FORBIDDEN: kubectl present"; exit 1; }
      command -v argocd >/dev/null 2>&1 && { echo "FORBIDDEN: argocd present"; exit 1; }

      echo "=== digest artifacts ==="
      ls -la digest-*.env 2>/dev/null || true

      git config user.email "ci@gitlab.local"
      git config user.name "GitLab CI boutique-eks-gitops"
      git config --global --add safe.directory "${CI_PROJECT_DIR}"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch --prune origin "${CI_DEFAULT_BRANCH}"
      BRANCH="ci/digests-${CI_PIPELINE_ID}"
      git checkout -B "${BRANCH}" "origin/${CI_DEFAULT_BRANCH}"

      shopt -s nullglob
      files=(digest-*.env)
      if [ "${#files[@]}" -eq 0 ]; then
        echo "ERROR: no digest-*.env artifacts from sign matrix"
        exit 1
      fi
      echo "found ${#files[@]} digest files"

      for f in "${files[@]}"; do
        set -a
        # shellcheck disable=SC1090
        source "${f}"
        set +a
        values="gitops/envs/dev/values/${SERVICE}.yaml"
        test -f "${values}"
        test -n "${DIGEST:-}"
        echo "set ${SERVICE} digest=${DIGEST}"
        yq -i ".image.digest = \"${DIGEST}\"" "${values}"
        git add -- "${values}"
      done

      mapfile -t changed < <(git diff --cached --name-only)
      for path in "${changed[@]}"; do
        case "${path}" in
          gitops/envs/dev/values/*.yaml) ;;
          *)
            echo "FORBIDDEN path in digest MR: ${path}"
            exit 1
            ;;
        esac
      done

      if git diff --cached --quiet; then
        echo "No digest changes (already current on ${CI_DEFAULT_BRANCH})"
        exit 0
      fi

      git commit -m "ci: update image digests for dev (${CI_COMMIT_SHORT_SHA}) [skip ci]"

      echo "=== git push ${BRANCH} + create MR via push options ==="
      # CI_JOB_TOKEN often cannot call POST /merge_requests (401). Push options use the
      # same git auth that already works when "Allow Git push requests" is enabled.
      if ! git push -u origin "HEAD:${BRANCH}" \
        -o merge_request.create \
        -o "merge_request.target=${CI_DEFAULT_BRANCH}" \
        -o "merge_request.title=ci: digest updates for dev (${CI_COMMIT_SHORT_SHA})" \
        -o "merge_request.description=Automated digest-only MR for gitops/envs/dev/values. Does not deploy to the cluster (see docs/ci.md)." \
        -o merge_request.remove_source_branch; then
        echo "ERROR: git push / MR create via push options failed."
        echo "Confirm Settings → CI/CD → Job token permissions → Allow Git push requests."
        echo "If the branch already exists without an MR, open one manually from ${BRANCH} → ${CI_DEFAULT_BRANCH}."
        exit 1
      fi
      echo "Push + MR create requested for branch ${BRANCH}"
      EOS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
