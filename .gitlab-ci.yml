# boutique-eks-gitops — GitLab CI
# Setup Topic 10 · Contract: docs/ci.md · Pins: docs/versions.md
#
# Stages: test → build → scan → sign → gitops (digest MR to envs/dev only)
# HARD RULES: no kubectl / no argocd CLI / no static AWS keys / no prod path writes

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^ci\/.*/

variables:
  AWS_DEFAULT_REGION: "eu-central-1"
  TRIVY_VERSION: "0.71.0"
  COSIGN_VERSION: "2.4.3"
  BOUTIQUE_UPSTREAM_TAG: "v0.10.2"
  BOUTIQUE_UPSTREAM_BASE: "us-docker.pkg.dev/google-samples/microservices-demo"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

default:
  image: docker:27.1.1
  services:
    - name: docker:27.1.1-dind
      alias: docker
      command: ["--tls=false"]

stages:
  - test
  - build
  - scan
  - sign
  - gitops

helm_lint:
  stage: test
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  services: []
  script:
    - helm version
    - helm lint charts/frontend charts/cartservice charts/redis charts/checkoutservice
    - helm lint charts/productcatalogservice charts/currencyservice charts/paymentservice charts/shippingservice
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.service_matrix:
  parallel:
    matrix:
      - SERVICE: [frontend, productcatalogservice, cartservice, checkoutservice, currencyservice, paymentservice, shippingservice]

.aws_ecr:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache bash curl jq git
    - |
      set -euo pipefail
      echo "${GITLAB_OIDC_TOKEN}" > /tmp/web-identity-token
      # Alpine job image cannot run glibc AWS CLI or broken apk/pip python stacks.
      # Use amazon/aws-cli via the DinD daemon (DOCKER_HOST).
      cat > /usr/local/bin/aws <<'AWSEOF'
      #!/bin/sh
      exec docker run --rm \
        -e AWS_DEFAULT_REGION \
        -e AWS_ROLE_ARN \
        -e AWS_WEB_IDENTITY_TOKEN_FILE=/token \
        -e AWS_ROLE_SESSION_NAME=gitlab-ci \
        -v /tmp/web-identity-token:/token:ro \
        amazon/aws-cli:2.15.57 "$@"
      AWSEOF
      # Strip leading spaces YAML may leave in the wrapper
      sed -i 's/^[[:space:]]*//' /usr/local/bin/aws
      chmod +x /usr/local/bin/aws
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      docker info >/dev/null
      test -n "${AWS_ROLE_ARN}"
      export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION}"
      aws --version
      aws sts get-caller-identity
      ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
      export REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
        | docker login --username AWS --password-stdin "${REGISTRY}"

build:
  stage: build
  extends:
    - .service_matrix
    - .aws_ecr
  script:
    - |
      set -euo pipefail
      SRC="${BOUTIQUE_UPSTREAM_BASE}/${SERVICE}:${BOUTIQUE_UPSTREAM_TAG}"
      DST="${REGISTRY}/boutique-eks-gitops/${SERVICE}"
      TAG="ci-${CI_COMMIT_SHORT_SHA}"
      docker pull "${SRC}"
      docker tag "${SRC}" "${DST}:${TAG}"
      docker push "${DST}:${TAG}"
      DIGEST="$(aws ecr describe-images --repository-name "boutique-eks-gitops/${SERVICE}" \
        --image-ids imageTag="${TAG}" --region "${AWS_DEFAULT_REGION}" \
        --query 'imageDetails[0].imageDigest' --output text)"
      {
        echo "SERVICE=${SERVICE}"
        echo "DIGEST=${DIGEST}"
        echo "IMAGE=${DST}@${DIGEST}"
        echo "TAG=${TAG}"
      } | tee "digest-${SERVICE}.env"
  artifacts:
    paths:
      - "digest-${SERVICE}.env"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

scan:
  stage: scan
  extends:
    - .service_matrix
    - .aws_ecr
  needs:
    - job: build
  script:
    - |
      set -euo pipefail
      # shellcheck disable=SC1090
      source "digest-${SERVICE}.env"
      curl -fsSL -o /tmp/trivy.tgz \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      tar -xzf /tmp/trivy.tgz -C /tmp trivy
      /tmp/trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed "${IMAGE}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sign:
  stage: sign
  extends:
    - .service_matrix
    - .aws_ecr
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - job: scan
  script:
    - |
      set -euo pipefail
      # shellcheck disable=SC1090
      source "digest-${SERVICE}.env"
      curl -fsSL -o /tmp/cosign \
        "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
      chmod +x /tmp/cosign
      export COSIGN_YES=true
      /tmp/cosign sign --yes "${IMAGE}"
  artifacts:
    paths:
      - "digest-${SERVICE}.env"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitops_digest_mr:
  stage: gitops
  image: alpine:3.20
  services: []
  needs:
    - job: sign
  before_script:
    - apk add --no-cache git curl bash yq
  script:
    - |
      bash <<'EOS'
      set -euo pipefail
      command -v kubectl >/dev/null 2>&1 && { echo "FORBIDDEN: kubectl present"; exit 1; }
      command -v argocd >/dev/null 2>&1 && { echo "FORBIDDEN: argocd present"; exit 1; }

      git config user.email "ci@gitlab.local"
      git config user.name "GitLab CI boutique-eks-gitops"
      git fetch origin "${CI_DEFAULT_BRANCH}"
      BRANCH="ci/digests-${CI_COMMIT_SHORT_SHA}"
      git checkout -B "${BRANCH}" "origin/${CI_DEFAULT_BRANCH}"

      shopt -s nullglob
      files=(digest-*.env)
      test "${#files[@]}" -gt 0

      for f in "${files[@]}"; do
        set -a
        # shellcheck disable=SC1090
        source "${f}"
        set +a
        values="gitops/envs/dev/values/${SERVICE}.yaml"
        test -f "${values}"
        yq -i ".image.digest = \"${DIGEST}\"" "${values}"
        git add -- "${values}"
      done

      mapfile -t changed < <(git diff --cached --name-only)
      for path in "${changed[@]}"; do
        case "${path}" in
          gitops/envs/dev/values/*.yaml) ;;
          *)
            echo "FORBIDDEN path in digest MR: ${path}"
            exit 1
            ;;
        esac
      done

      if git diff --cached --quiet; then
        echo "No digest changes"
        exit 0
      fi

      git commit -m "ci: update image digests for dev (${CI_COMMIT_SHORT_SHA})"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push -u origin "HEAD:${BRANCH}" -o ci.skip

      curl --fail --silent --show-error \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "source_branch=${BRANCH}" \
        --data-urlencode "target_branch=${CI_DEFAULT_BRANCH}" \
        --data-urlencode "title=ci: digest updates for dev (${CI_COMMIT_SHORT_SHA})" \
        --data-urlencode "description=Automated **digest-only** MR for \`gitops/envs/dev/values\`. Does **not** deploy to the cluster (see docs/ci.md)." \
        --data-urlencode "remove_source_branch=true" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
      EOS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
