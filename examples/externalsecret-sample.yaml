# Example ExternalSecret — Secrets Manager → Kubernetes Secret
# Setup Topic 07 Step 7.5
#
# Prerequisites:
# 1. Create a secret in AWS Secrets Manager (eu-central-1), e.g. name:
#      boutique-eks-gitops/eso-smoke
#    JSON key: smoke-key
# 2. ESO + ClusterSecretStore aws-cluster-secret-store Ready
# 3. IRSA role can read that secret ARN
#
# Apply to a non-prod namespace for the test:
#   kubectl apply -f examples/externalsecret-sample.yaml
# Cleanup after validation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-smoke-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: eso-smoke-secret
    creationPolicy: Owner
  data:
    - secretKey: smoke-key
      remoteRef:
        # PLACEHOLDER — replace with your Secrets Manager secret name or ARN
        key: boutique-eks-gitops/eso-smoke
        property: smoke-key
