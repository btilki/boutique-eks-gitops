# Negative — tag without @sha256 must fail require-image-digest
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-missing-digest-test
  namespace: dev
  labels:
    test: kyverno-unit
spec:
  containers:
    - name: pause
      image: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/boutique-eks-gitops/frontend:ci-deadbeef
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  restartPolicy: Never
