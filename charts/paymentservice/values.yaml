# Image contract: repository + digest (ADR-0001). Never use :latest.
# REPLACE digest after Topic 09 bootstrap ECR push.
image:
  repository: "REPLACE_ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/boutique-eks-gitops/paymentservice"
  digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 50051

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  PORT: "50051"
  DISABLE_PROFILER: "1"
  DISABLE_TRACING: "1"
  DISABLE_DEBUGGER: "1"

nameOverride: ""
fullnameOverride: "paymentservice"
