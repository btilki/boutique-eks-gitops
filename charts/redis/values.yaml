# Prefer mirroring redis to project ECR in Topic 09 bootstrap (Kyverno ECR allowlist).
image:
  repository: "REPLACE_ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/boutique-eks-gitops/redis"
  digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  pullPolicy: IfNotPresent

replicaCount: 1
service:
  type: ClusterIP
  port: 6379
serviceAccount:
  create: true
  name: ""
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
env: {}
fullnameOverride: "redis"
