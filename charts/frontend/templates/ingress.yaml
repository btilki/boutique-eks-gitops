{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.canary.enabled }}
    # Seed ALB weighted forward action; Rollouts updates weights during canary.
    # Action name must match the Ingress backend service name (root).
    alb.ingress.kubernetes.io/actions.{{ include "frontend.fullname" . }}-root: |
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"{{ include "frontend.fullname" . }}","servicePort":{{ .Values.service.port }},"weight":100},{"serviceName":"{{ include "frontend.fullname" . }}-canary","servicePort":{{ .Values.service.port }},"weight":0}]}}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.canary.enabled }}
                name: {{ include "frontend.fullname" . }}-root
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "frontend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
                {{- end }}
{{- end }}
