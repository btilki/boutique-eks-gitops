{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "frontend.serviceAccountName" . }}
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
  strategy:
    canary:
      canaryService: {{ include "frontend.fullname" . }}-canary
      stableService: {{ include "frontend.fullname" . }}
      trafficRouting:
        alb:
          ingress: {{ include "frontend.fullname" . }}
          servicePort: {{ .Values.service.port }}
          rootService: {{ include "frontend.fullname" . }}-root
      {{- if and .Values.canary.analysis .Values.canary.analysis.enabled }}
      # Topic 18 / ADR-0009 — background analysis while canary progresses
      analysis:
        templates:
          - templateName: {{ .Values.canary.analysis.background.templateName | default "frontend-pod-ready" }}
            clusterScope: {{ .Values.canary.analysis.background.clusterScope | default true }}
        args:
          - name: namespace
            value: {{ .Release.Namespace | quote }}
          - name: pod-prefix
            value: {{ include "frontend.fullname" . | quote }}
      {{- end }}
      steps:
        {{- if and .Values.canary.analysis .Values.canary.analysis.enabled .Values.canary.analysis.steps }}
        {{- toYaml .Values.canary.analysis.steps | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.canary.steps | nindent 8 }}
        {{- end }}
{{- end }}
